name: Bump formula on upstream release

on:
  schedule:
    - cron: '0 0 * * 1'          # 每周一 UTC 0 点运行
  workflow_dispatch:               # 允许手动触发

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew tap
        run: brew tap morii0v0/homebrew-core

      - name: Bump outdated formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          set -euo pipefail

          # 避免 openvpn3 和 homebrew/core 冲突
          brew untap homebrew/core 2>/dev/null || true

          OUTDATED=$(brew livecheck --tap morii0v0/homebrew-core --newer-only --json 2>/dev/null || echo "[]")

          echo "$OUTDATED" | jq -r '.[] | "\(.formula)\t\(.version.latest)"' | while IFS=$'\t' read -r formula version; do
            if [ -z "$formula" ] || [ -z "$version" ]; then
              continue
            fi

            # 检查是否已有同版本 PR
            BRANCH="bump-${formula}-${version}"
            if gh pr list --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null | grep -q '[1-9]'; then
              echo "::notice::Skipping $formula $version: PR already exists"
              continue
            fi

            echo "::group::Bumping $formula to $version"
            brew bump-formula-pr \
              --version="$version" \
              --no-audit \
              --no-browse \
              --no-fork \
              --message="$formula: update to $version" \
              "morii0v0/homebrew-core/$formula" || echo "::warning::Failed to bump $formula"
            echo "::endgroup::"
          done
